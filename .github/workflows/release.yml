# Builds the release archives and attaches them to a GitHub release.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# One archive per system (bin/studio dist): the Java parts are the same in each, the media service and
# the Live cache are compiled for that system. Run it by hand (Actions > Release > Run workflow) to
# try the build without making a release: the archives are then only kept as artifacts of the run.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to put in the archive names (no release is made)'
        required: true
        default: '0.0.0-test'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: author-ui/package-lock.json

      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            dam-service/target
            live-service/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dam-service/Cargo.lock', 'live-service/Cargo.lock') }}

      - name: Version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the archive
        run: bin/studio dist "${{ steps.version.outputs.value }}"

      - uses: actions/upload-artifact@v4
        with:
          name: sensible-studio-${{ matrix.os }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Publish the release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Sensible Studio ${GITHUB_REF_NAME#v}" \
            --generate-notes
