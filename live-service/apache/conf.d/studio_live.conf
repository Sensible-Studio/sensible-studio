#
# Sensible Studio Live cache: what every virtual host of a published site shares.
#
# Apache serves a page from the document root when the file is there, and asks the studio-live
# service (which fetches it from the publish and writes the file) when it is not.
#
# Needs: mod_rewrite, mod_proxy, mod_proxy_http, mod_headers, mod_deflate
#   Debian/Ubuntu:  a2enmod rewrite proxy proxy_http headers deflate
#   elsewhere:      LoadModule lines for the same five in httpd.conf
#
# Put this directory's content into Apache's conf.d (or Include it), then:  apachectl configtest
#

# Set these here, or Define them before this file is included (then the lines below are skipped).
# The cache directory: the `docroot` of live.toml, as an absolute path.
<IfDefine !STUDIO_LIVE_DOCROOT>
    Define STUDIO_LIVE_DOCROOT /var/cache/studio-live/docroot
</IfDefine>
# Where the studio-live service listens: the `listen` of live.toml.
<IfDefine !STUDIO_LIVE_SERVICE>
    Define STUDIO_LIVE_SERVICE 127.0.0.1:4520
</IfDefine>
# The port the sites' virtual hosts answer on.
<IfDefine !STUDIO_LIVE_PORT>
    Define STUDIO_LIVE_PORT 80
</IfDefine>

# HTTPS (a server): Define STUDIO_LIVE_TLS before this file, enable mod_ssl and put each site's
# certificate in the directory below (<site>.crt, <site>.key, and default.crt / default.key for
# the virtual host of unknown names). Without it every site answers over HTTP.
<IfDefine !STUDIO_LIVE_TLS_PORT>
    Define STUDIO_LIVE_TLS_PORT 443
</IfDefine>
<IfDefine !STUDIO_LIVE_TLS_DIR>
    Define STUDIO_LIVE_TLS_DIR /etc/studio-live/tls
</IfDefine>

# The visitor's Host goes on to the publish (its URL mappings depend on it); mod_proxy adds
# X-Forwarded-For by itself.
ProxyPreserveHost On
ProxyRequests Off
# Sling decodes the path itself.
AllowEncodedSlashes NoDecode

<Directory "${STUDIO_LIVE_DOCROOT}">
    Require all granted
    AllowOverride None
    Options -Indexes -MultiViews +FollowSymLinks
    # A page (en.html) and the folder of its children (en/) live side by side.
    DirectorySlash Off
    DirectoryIndex disabled
    # Pages are UTF-8; a file has no header of its own to say so.
    AddDefaultCharset UTF-8

    # The service's temporary files.
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    RewriteEngine On
    # A cached file a publication takes out while Apache serves it (found by the check below, gone
    # when Apache opens it) is Apache's own 403: the request is asked of the service instead, which
    # fetches the page again. Only for files Apache serves (STUDIO_LIVE_FILE, set below): an answer
    # the service passes on is the visitor's as it is, or the site's error page (ErrorDocument in
    # its virtual host).
    ErrorDocument 403 /_studio_live_again
    RewriteCond %{ENV:REDIRECT_STATUS} =403
    RewriteCond %{REQUEST_URI} =/_studio_live_again
    RewriteCond %{ENV:REDIRECT_STUDIO_LIVE_FILE} ^/
    RewriteRule ^ http://${STUDIO_LIVE_SERVICE}%{ENV:REDIRECT_STUDIO_LIVE_FILE} [P,L]
    # To the service when the answer may differ per visitor, or is not in the cache yet:
    #   anything but a GET or HEAD, a query string, credentials, a signed-in visitor,
    #   a suffix after a cached file (/en.html/more), no file.
    RewriteCond %{REQUEST_METHOD} !^(GET|HEAD)$ [OR]
    RewriteCond %{QUERY_STRING} !^$ [OR]
    RewriteCond %{HTTP:Authorization} !^$ [OR]
    RewriteCond %{HTTP_COOKIE} (studio-login|sling\.formauth\.publish)= [NC,OR]
    RewriteCond %{PATH_INFO} !^$ [OR]
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteRule ^ http://${STUDIO_LIVE_SERVICE}%{REQUEST_URI} [P,L]
    # Everything else is a file in this directory, served as one; its path noted for the 403 above.
    RewriteRule ^ - [E=STUDIO_LIVE_FILE:%{REQUEST_URI}]
</Directory>

<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/css text/javascript application/javascript application/json application/xml image/svg+xml
</IfModule>
