[package]
name = "studio-live"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Sensible Studio Live cache: the filter, page cache and invalidation endpoint that sit between Apache httpd and the publish instances"
publish = false

[[bin]]
name = "studio-live"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
bytes = "1"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
