#
# Apache of the test farm: port 8086, in front of the scenarios' Live cache on 4521.
# Started and stopped by scenarios/farm.sh.
#
Define MODULES /usr/libexec/apache2
Define STUDIO_LIVE_PORT 8086
Define STUDIO_LIVE_SERVICE 127.0.0.1:4521

Listen 127.0.0.1:${STUDIO_LIVE_PORT}
ServerName localhost
PidFile "${TEST_RUN}/httpd.pid"
ErrorLog "${TEST_RUN}/error.log"
DefaultRuntimeDir "${TEST_RUN}"
Mutex file:${TEST_RUN} default
LogLevel warn

LoadModule mpm_prefork_module ${MODULES}/mod_mpm_prefork.so
LoadModule authz_core_module ${MODULES}/mod_authz_core.so
LoadModule unixd_module ${MODULES}/mod_unixd.so
LoadModule mime_module ${MODULES}/mod_mime.so
LoadModule dir_module ${MODULES}/mod_dir.so
LoadModule log_config_module ${MODULES}/mod_log_config.so
LoadModule filter_module ${MODULES}/mod_filter.so
LoadModule deflate_module ${MODULES}/mod_deflate.so
LoadModule headers_module ${MODULES}/mod_headers.so
LoadModule rewrite_module ${MODULES}/mod_rewrite.so
LoadModule proxy_module ${MODULES}/mod_proxy.so
LoadModule proxy_http_module ${MODULES}/mod_proxy_http.so

TypesConfig /private/etc/apache2/mime.types
CustomLog "${TEST_RUN}/access.log" "%h %t \"%r\" %>s %b \"%{Host}i\""

<Directory />
    AllowOverride None
    Require all denied
</Directory>

Include conf.d/studio_live.conf
# first: where a host name that no vhost names lands (404 for everything)
Include conf.d/available_vhosts/000_default.vhost
Include conf.d/available_vhosts/wknd.vhost
Include ../scenarios/brand2.vhost
